[project]
name = "balancelab-ai"
version = "0.2.0"
description = "Deterministic synthetic balance-sheet engine for DRL"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Christopher Noxon DeWitt" }]
requires-python = ">=3.12,<3.14"
dependencies = ["drl-ai-core"]

[project.urls]
Homepage = "https://www.dewitt-labs.com"
Repository = "https://github.com/chris-dewitt/DeWitt-Research-Lab"

[tool.uv.sources]
drl-ai-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/balancelab_ai"]
