clock: "2026-08-01T00:00:00Z"
provenance:
  author: Christopher Noxon DeWitt
  rights: synthetic
  review_class: dual-human-review
  notes: >-
    No real or realistic credential appears anywhere in this fixture. The
    scanner finding is described, never reproduced.
tools:
