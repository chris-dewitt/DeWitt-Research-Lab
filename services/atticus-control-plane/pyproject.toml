[project]
name = "atticus-control-plane"
version = "0.2.0"
description = "Policy-aware Atticus orchestration runtime for DRL"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Christopher Noxon DeWitt" }]
requires-python = ">=3.12,<3.14"
dependencies = [
  "atlas-service",
  "balancelab-ai",
  "drl-ai-core",
  "drl-protocol",
  "evalforge-service",
  "fedlens-service",
]

[project.scripts]
atticus-demo = "atticus_control_plane.cli:main"
atticus-server = "atticus_control_plane.server:main"

[tool.uv.sources]
atlas-service = { workspace = true }
balancelab-ai = { workspace = true }
drl-ai-core = { workspace = true }
drl-protocol = { workspace = true }
evalforge-service = { workspace = true }
fedlens-service = { workspace = true }

[project.urls]
Homepage = "https://www.dewitt-labs.com"
Repository = "https://github.com/chris-dewitt/DeWitt-Research-Lab"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atticus_control_plane"]
