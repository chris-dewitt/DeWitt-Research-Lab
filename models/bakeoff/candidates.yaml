# Atticus Core/Edge bake-off candidate register (scaffold)
# Maturity: prototype scaffolding for DRL-012 / DIR-004 evidence.
# This is NOT a base-model selection. No winner is declared.

suite_id: atticus.bakeoff.scaffold
suite_version: "1.0.0"
as_of: "2026-08-23"
selection_status: not_selected
director_gate: DIR-004
notes:
  - Shortlist refreshed for scaffold only; exact revisions must be revalidated before a live bake-off.
  - Fixture metrics are synthetic placeholders for CI reproducibility, not measured hardware runs.
  - Commercial/closed-weight candidates are excluded from the V1 production path.
  - edge-qwen3-1.7b and edge-smollm3-3b have workstation serving tags so a local
    Ollama daemon can drive Atticus. That is not a DIR-004 selection.

candidates:
  - id: core-qwen35-9b-class
    role: core
    family: Qwen 3.5 9B-class
    revision_label: scaffold-unpinned
    license_label: Apache-2.0
    license_status: provisional_review_required
    open_weight: true
    hardware_class: gpu-16gb-class
    estimated_vram_gb: 18
    cost_tier: medium
    source_url: https://huggingface.co/Qwen/Qwen3.5-9B
    limitations:
      - Exact revision and tool parser must be pinned before Stage B.
      - Memory estimate is scaffold-only.

  - id: core-ministral3-8b-class
    role: core
    family: Ministral 3 8B-class
    revision_label: scaffold-unpinned
    license_label: Apache-2.0
    license_status: provisional_review_required
    open_weight: true
    hardware_class: gpu-16gb-class
    estimated_vram_gb: 16
    cost_tier: medium
    source_url: https://mistral.ai/news/mistral-3/
    limitations:
      - Confirm current model-card Apache-2.0 terms at bake-off time.
      - Not the older 2024 Ministral release line.

  - id: core-gemma4-26b
    role: core
    family: Gemma 4 26B-class
    revision_label: "ollama:gemma4:26b"
    license_label: Apache-2.0
    license_status: reported_apache_2_0_pending_confirmation
    open_weight: true
    hardware_class: gpu-24gb-class
    estimated_vram_gb: 16
    cost_tier: medium
    source_url: https://ollama.com/library/gemma4
    # The only candidate actually stood up. Presence of this block is what puts
    # it in a `--live` run; the others are skipped until someone serves them.
    serving:
      runtime: ollama
      model: gemma4:26b
      quantization: Q4_K_M
    limitations:
      - Reported parameters 25.8B, Q4_K_M, 262144 context (ollama show, 2026-08-09).
      - License read from the packaged model card, not the upstream publisher page;
        confirm before recording the gate condition as cleared.
      - Larger than the documented Core class (~8-10B); revisit the class definition
        or record the deviation before selection.
      - Advertises reasoning output; planner discards thinking content by policy.

  - id: edge-qwen35-4b-class
    role: edge
    family: Qwen 3.5 4B-class
    revision_label: scaffold-unpinned
    license_label: Apache-2.0
    license_status: provisional_review_required
    open_weight: true
    hardware_class: cpu-or-8gb-gpu
    estimated_vram_gb: 6
    cost_tier: low
    source_url: https://huggingface.co/Qwen
    limitations:
      - Edge latency and noisy-ASR robustness still unmeasured.

  - id: edge-qwen3-1.7b
    role: edge
    family: Qwen 3 1.7B
    revision_label: "ollama:qwen3:1.7b"
    license_label: Apache-2.0
    license_status: provisional_review_required
    open_weight: true
    hardware_class: cpu-or-8gb-gpu
    estimated_vram_gb: 2
    cost_tier: low
    source_url: https://ollama.com/library/qwen3
    serving:
      runtime: ollama
      model: qwen3:1.7b
      quantization: Q4_K_M
    limitations:
      - Workstation/edge-class serving profile, not a Core candidate.
      - Official Ollama tag `qwen3:1.7b` (~1.4 GB Q4_K_M). The Hugging Face
        GGUF tag `hf.co/Qwen/Qwen3-1.7B-GGUF:Q8_0` is an equivalent family
        member if that is what the daemon on :11434 actually lists.
      - Hybrid thinking model; set ATTICUS_MODEL_NO_THINKING=1 for planning.
      - Ollama library tags are not digest pins; confirm `ollama show` before
        treating a live run as revision-pinned evidence.
      - Pulls must land on the daemon answering GET /v1/models, not merely
        appear in an unpinned `ollama list`.

  - id: edge-smollm3-3b
    role: edge
    family: SmolLM3 3B
    revision_label: "ollama:hf.co/ggml-org/SmolLM3-3B-GGUF:Q4_K_M"
    license_label: Apache-2.0
    license_status: provisional_review_required
    open_weight: true
    hardware_class: cpu-or-8gb-gpu
    estimated_vram_gb: 3
    cost_tier: low
    source_url: https://huggingface.co/HuggingFaceTB/SmolLM3-3B
    serving:
      runtime: ollama
      model: hf.co/ggml-org/SmolLM3-3B-GGUF:Q4_K_M
      quantization: Q4_K_M
    limitations:
      - Workstation/edge-class serving profile, not a Core candidate.
      - SmolLM3 is not in the official Ollama library. The serving tag is the
        ggml-org GGUF conversion of HuggingFaceTB/SmolLM3-3B (Apache-2.0).
        Confirm the exact name in GET /api/tags after the pull.
      - Hybrid thinking model; set ATTICUS_MODEL_NO_THINKING=1 for planning.
      - GGUF conversion provenance is ggml-org, not Hugging Face TB; read both
        cards before clearing license_status.
      - Pulls must land on the daemon answering GET /v1/models, not merely
        appear in an unpinned `ollama list`.

  - id: edge-ministral3-3b-class
    role: edge
    family: Ministral 3 3B-class
    revision_label: scaffold-unpinned
    license_label: Apache-2.0
    license_status: provisional_review_required
    open_weight: true
    hardware_class: cpu-or-8gb-gpu
    estimated_vram_gb: 4
    cost_tier: low
    source_url: https://mistral.ai/news/mistral-3/
    limitations:
      - Exact card and quantization matrix required before Stage A hardware.

runtimes:
  - id: vllm
    class: cloud-serving
    notes: Primary cloud candidate; parser/template validation required.
  - id: llama-cpp
    class: local-edge
    notes: Primary local/edge candidate; GGUF evaluated separately.
  - id: transformers
    class: research
    notes: Default post-training/distribution ecosystem.

