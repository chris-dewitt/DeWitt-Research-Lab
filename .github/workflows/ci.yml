name: foundation-ci

on:
  pull_request:
  push:
    branches: [main, integration/v1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true
      - name: Sync Python workspace
        run: uv sync --all-packages --locked
      - name: Deep foundation validation
        run: uv run python scripts/validate_foundation.py
      - name: Open identity validation
        run: uv run python scripts/validate_open_identity.py
      - name: Domain and Wix validation
        run: uv run python scripts/validate_domain_wix.py
      - name: Python lint
        run: uv run ruff check scripts tests packages services apps/atticus-local-runner
      - name: Python tests
        run: uv run pytest
      - name: Integrated Atticus smoke test
        run: uv run --package atticus-control-plane atticus-demo --public
      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-validation
          path: |
            VALIDATION_REPORT.md
            PACKAGE_MANIFEST.json
          if-no-files-found: ignore

  node-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build

  atticus-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Atticus foundation image
        run: >-
          docker build
          --file services/atticus-control-plane/Dockerfile
          --tag atticus-foundation:${{ github.sha }}
          .
