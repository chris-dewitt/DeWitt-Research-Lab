schema_version: 1.0.0
canonical_domain: dewitt-labs.com
canonical_origin: https://www.dewitt-labs.com
apex_behavior:
  host: dewitt-labs.com
  action: permanent_redirect
  target: https://www.dewitt-labs.com
institutional_site:
  host: www.dewitt-labs.com
  platform: Wix
  role: canonical-public-institutional-site
  status: live
applications:
  - id: atticus
    host: atticus.dewitt-labs.com
    role: public-atticus-console
    status: planned
  - id: atlas
    host: atlas.dewitt-labs.com
    role: macro-research-application
    status: planned
  - id: fedlens
    host: fedlens.dewitt-labs.com
    role: monetary-policy-application
    status: planned
  - id: balancelab
    host: balancelab.dewitt-labs.com
    role: synthetic-scenario-application
    status: planned
  - id: evalforge
    host: evalforge.dewitt-labs.com
    role: evaluation-application
    status: planned
  - id: docs
    host: docs.dewitt-labs.com
    role: versioned-documentation
    status: planned
  - id: status
    host: status.dewitt-labs.com
    role: public-status
    status: planned
  - id: api
    host: api.dewitt-labs.com
    role: public-api-gateway
    status: conditional
policies:
  primary_apps_embedded_in_wix: false
  embeds_allowed_for_bounded_public_widgets: true
  separate_auth_until_adr: true
  repository_is_technical_source_of_truth: true
  wix_is_editorial_and_institutional_source: true
  production_cookie_parent_domain_allowed: false
  staging_indexing_allowed: false
