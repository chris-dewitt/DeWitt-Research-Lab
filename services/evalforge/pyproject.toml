[project]
name = "evalforge-service"
version = "0.2.0"
description = "Deterministic trajectory evaluation starter for DRL"
requires-python = ">=3.12,<3.14"
dependencies = [
  "drl-ai-core",
  "drl-protocol",
]

[tool.uv.sources]
drl-ai-core = { workspace = true }
drl-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalforge_service"]
