  - name: git.commit
    example_arguments:
      message: "save work in progress"
    description: Record the staged changes as a local commit
    risk_tier: reversible_change
    public_allowed: false
    argument_contract:
      required: [message]
      allowed: [message, paths]
      max_length:
        message: 200
    effect:
      kind: local_write
      target: refs/heads/work
      reversible: true
