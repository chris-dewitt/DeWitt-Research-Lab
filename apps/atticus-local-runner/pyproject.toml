[project]
name = "atticus-local-runner"
version = "0.4.0"
description = "User-controlled local capabilities for private Atticus workflows"
requires-python = ">=3.12,<3.14"
dependencies = ["drl-ai-core"]

[tool.uv.sources]
drl-ai-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atticus_local_runner"]
