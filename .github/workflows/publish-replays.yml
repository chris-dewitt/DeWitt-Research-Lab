name: publish-public-artifacts

# Builds a reviewable, allowlisted replay export on every relevant main-branch
# change. A public write occurs only through an explicit manual dispatch.

on:
  push:
    branches: [main]
    paths:
      - "services/evalforge/fixtures/signed_replays/**"
      - "services/evalforge/src/evalforge_service/replay_site.py"
      - "scripts/build_replay_site.py"
      - "scripts/prepare_public_replay_release.py"
      - "configs/public-artifact-export.yaml"
      - "configs/open-exceptions/**"
      - ".github/workflows/publish-replays.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the verified export to DeWitt-Research-Artifacts"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: public-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-optionally-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out authoritative source
        uses: actions/checkout@v7

      - name: Refuse publication from a non-main revision
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.publish &&
          github.ref != 'refs/heads/main'
        run: |
          echo "Public writes are permitted only from refs/heads/main." >&2
          exit 1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Sync Python workspace
        run: uv sync --all-packages --locked

      - name: Verify replay bundles and build the viewer
        run: uv run python scripts/build_replay_site.py --out site/replays --metadata

      - name: Prepare the allowlisted public release
        run: >-
          uv run python scripts/prepare_public_replay_release.py
          --site-dir site/replays
          --out site/public-replays
          --source-revision "${{ github.sha }}"

      - name: Check the release envelope
        run: |
          test -s site/public-replays/index.html
          test -s site/public-replays/success.html
          test -s site/public-replays/degraded.html
          test -s site/public-replays/release-manifest.json
          test -f site/public-replays/.nojekyll

      - name: Upload review artifact
        uses: actions/upload-artifact@v7
        with:
          name: public-replays-${{ github.sha }}
          path: site/public-replays
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Check out the public deployment mirror
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.publish &&
          github.ref == 'refs/heads/main'
        uses: actions/checkout@v7
        with:
          repository: chris-dewitt/DeWitt-Research-Artifacts
          ref: main
          token: ${{ secrets.PUBLIC_ARTIFACT_TOKEN }}
          path: public-site

      - name: Replace the public mirror with the verified envelope
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.publish &&
          github.ref == 'refs/heads/main'
        run: rsync -a --delete --exclude='.git' site/public-replays/ public-site/

      - name: Publish the reviewed source revision
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.publish &&
          github.ref == 'refs/heads/main'
        working-directory: public-site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Public artifact mirror already matches ${GITHUB_SHA}."
            exit 0
          fi
          git commit -m "publish: replay viewer from ${GITHUB_SHA}"
          git push origin main
