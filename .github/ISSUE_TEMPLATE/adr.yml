name: Architecture Decision
description: Propose a major decision requiring DeWitt approval
title: "[ADR]: "
labels: ["architecture", "approval-required"]
body:
  - type: input
    id: adr_id
    attributes:
      label: ADR / Director ID
      description: e.g. ADR-0006 or DIR-002
      placeholder: ADR-0006
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and problem
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Proposed decision
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and consequences
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence required before approval
      description: Benchmarks, license review, cost, security tests, spike results.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security, privacy, compatibility, and migration
    validations:
      required: true
  - type: textarea
    id: blocked_work
    attributes:
      label: Work blocked until resolution
      placeholder: DRL-023 terraform apply; Mission 05 toolchain lock
    validations:
      required: true
