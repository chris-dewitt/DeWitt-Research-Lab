    description: Move a flagged file out of the working tree and into the ignore list
    risk_tier: reversible_change
    public_allowed: false
    argument_contract:
      required: [path]
      allowed: [path]
      patterns:
        path: "[A-Za-z0-9._/-]{1,80}"
    effect:
      kind: local_write
      target: .gitignore
      reversible: true
    response:
