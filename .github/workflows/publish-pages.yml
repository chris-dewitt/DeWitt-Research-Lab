name: publish-pages

# Builds the static replay viewer and publishes it to GitHub Pages.
#
# This is a restoration. The same workflow existed before and was correct; it
# failed only because GitHub Pages will not serve a private personal repository
# on the Director's plan. RES-024 made the repository public, which removes the
# constraint. See docs/adr/ADR-0009 (SUPERSEDED) for the boundary this replaces.
#
# It needs no cloud account, GPU, or inference budget: the replay bundles are
# signed JSON already in the repository and the viewer is static HTML. The build
# verifies every bundle's manifest signature and artifact digests before
# rendering, so a tampered recording fails the workflow rather than being
# published under a claim of provenance it does not have.

on:
  push:
    branches: [main]
    paths:
      - "services/evalforge/fixtures/signed_replays/**"
      - "services/evalforge/src/evalforge_service/replay_site.py"
      - "scripts/build_replay_site.py"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deployment of the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the replay viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Sync Python workspace
        run: uv sync --all-packages --locked
      - name: Verify replay bundles and build the viewer
        run: uv run python scripts/build_replay_site.py --out site/replays --metadata
      - name: Check the build produced pages
        run: |
          test -s site/replays/index.html
          test -s site/replays/success.html
          test -s site/replays/degraded.html
          test -s site/replays/site.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/replays

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # `deploy-pages` reports success when GitHub accepts the deployment, which
      # is not the same claim as the edge serving it. On 2026-08-23 every job in
      # this workflow was green while the published URL answered 404 with "the
      # site configured at this address does not contain the requested file" —
      # the Pages record had been re-created and nothing had been deployed onto
      # it since. A workflow that reports a publication it cannot observe is
      # exactly the failure this laboratory refuses elsewhere, so verify.
      - name: Verify the published site is actually served
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -u
          code=000
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "${PAGE_URL}" || echo 000)"
            echo "attempt ${attempt}: ${PAGE_URL} -> ${code}"
            if [ "${code}" = "200" ]; then
              echo "the published site is serving"
              exit 0
            fi
            sleep 20
          done
          echo "::error::${PAGE_URL} never returned 200 (last status ${code}). The deployment was accepted but the site is not being served. Check Settings -> Pages: the site record may have been re-created without a deployment landing on it."
          exit 1
