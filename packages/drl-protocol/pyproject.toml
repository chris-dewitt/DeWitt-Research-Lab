[project]
name = "drl-protocol"
version = "0.1.0"
description = "Typed contracts for DeWitt Research Laboratory components"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Christopher Noxon DeWitt" }]
requires-python = ">=3.12,<3.14"
dependencies = []

[project.urls]
Homepage = "https://www.dewitt-labs.com"
Repository = "https://github.com/chris-dewitt/DeWitt-Research-Lab"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drl_protocol"]
